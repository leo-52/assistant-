name: Cours et alertes
on:
  schedule:
    - cron: "*/5 * * * *"   # une tache toutes les 5 min (au plus une en attente) ; chacune tourne 10 min et refait un passage chaque minute
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cours
  cancel-in-progress: false
jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography pywebpush
      - name: Cours, Polymarket et alertes
        env:
          VAPID_PRIVEE: ${{ secrets.VAPID_PRIVEE }}
          PUSH_ABONNEMENTS: ${{ secrets.PUSH_ABONNEMENTS }}
          MINUTES: "10"
        run: python outils/cours.py || echo 'relève interrompue'
      - name: Publier
        run: |
          git config user.name "assistant-cours"
          git config user.email "assistant-cours@users.noreply.github.com"
          git add data/cours.json data/auto_etat.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Cours $(date -u +%H:%M)"
          for essai in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 7))
          done
          echo "envoi impossible après 5 essais : la prochaine tâche reprendra"
