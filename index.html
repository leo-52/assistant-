<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bourse</title>
<meta name="description" content="Alertes, points et prédictions de bourse.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1016" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bourse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --surface2:#eceff3; --line:#dfe3ea; --text:#121826; --muted:#5a6575;
  --up:#087f4c; --up-bg:#e2f5eb; --down:#c62833; --down-bg:#fde8ea; --warn:#96610b; --warn-bg:#fbf0d9;
  --info:#1d55c9; --info-bg:#e5edfc; --accent:#0d6f68; --ombre:0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c1016; --surface:#151b24; --surface2:#1d2531; --line:#27313f; --text:#e9eef4; --muted:#93a0b2;
    --up:#34d28d; --up-bg:#10301f; --down:#ff6f76; --down-bg:#3a1719; --warn:#f1b84b; --warn-bg:#35280d;
    --info:#74abff; --info-bg:#14264a; --accent:#3fd8c5; --ombre:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:19px;letter-spacing:-.01em;flex:none}
#fraicheur{flex:1;min-width:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fraicheur.souci{color:var(--warn)}
#relire{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;cursor:pointer}
#relire svg{width:18px;height:18px}
#relire.tourne svg{animation:tour .8s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
main{max-width:720px;margin:0 auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 86px)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 97%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:720px}
nav button{flex:1;min-width:0;background:none;border:0;padding:6px 2px 4px;border-radius:10px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;cursor:pointer;position:relative}
nav button svg{width:23px;height:23px}
nav button[aria-current="page"]{color:var(--accent);font-weight:600}
nav .pastille{position:absolute;top:1px;left:calc(50% + 5px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--down);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:20px 2px 8px;font-weight:650}
h2:first-child{margin-top:4px}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;box-shadow:var(--ombre)}
.balise{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;
  background:var(--surface2);color:var(--muted);white-space:nowrap;vertical-align:1px}
.b-up{background:var(--up-bg);color:var(--up)} .b-down{background:var(--down-bg);color:var(--down)}
.b-warn{background:var(--warn-bg);color:var(--warn)} .b-info{background:var(--info-bg);color:var(--info)}
.up{color:var(--up);font-weight:600} .down{color:var(--down);font-weight:600} .doux{color:var(--muted)}
.petit{font-size:12.5px} .fort{font-weight:650}
.puces{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
.puces::-webkit-scrollbar{display:none}
.puce{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.puce[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.vide{color:var(--muted);text-align:center;padding:34px 16px}
/* alertes */
.alerte{border-left:4px solid var(--muted);padding-left:12px}
.alerte.t-ALERTE,.alerte.t-MOUVEMENT{border-left-color:var(--down)} .alerte.t-RUMEUR{border-left-color:var(--warn)}
.alerte.t-ARGENT,.alerte.t-MACRO,.alerte.t-INFO{border-left-color:var(--info)}
.alerte .haut{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.alerte .haut time{margin-left:auto;color:var(--muted);font-size:12px}
.alerte h3{margin:0 0 3px;font-size:15.5px;line-height:1.3}
.alerte p{margin:0;color:var(--text)}
.alerte .bas{margin-top:6px;color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.neuve{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
/* points */
details.point{padding:0}
details.point>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px}
details.point>summary::-webkit-details-marker{display:none}
details.point>summary .nom{font-weight:650;flex:1;min-width:0}
details.point>summary .chevron{width:16px;height:16px;color:var(--muted);transition:transform .15s}
details.point[open]>summary .chevron{transform:rotate(90deg)}
details.point .corps{padding:0 14px 12px;border-top:1px solid var(--line)}
.corps .section{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:14px 0 4px}
.corps .ligne{margin:8px 0;padding:0}
.corps .ligne .titre{font-weight:700;margin-bottom:2px}
.corps .ligne.titree{background:var(--surface2);border-radius:10px;padding:9px 11px}
.corps ul{margin:0;padding:0;list-style:none}
.corps li{position:relative;padding-left:13px;margin:2px 0}
.corps li::before{content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--muted);opacity:.7}
.corps .note{color:var(--muted);font-size:12.5px;margin-top:12px}
/* predictions */
.pred .tete{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pred .tick{font-size:18px;font-weight:750;letter-spacing:-.01em}
.pred .grille{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:8px;font-size:14px}
.pred .grille dt{color:var(--muted);font-size:12.5px;padding-top:1px} .pred .grille dd{margin:0;min-width:0}
.pred details{margin-top:8px;font-size:13.5px} .pred summary{color:var(--accent);cursor:pointer;font-size:13px}
.rang{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rang:first-child{border-top:0;padding-top:2px} .rang:last-child{padding-bottom:2px}
.rang .tick{font-weight:700;width:58px;flex:none} .rang .mil{flex:1;min-width:0;color:var(--muted);font-size:12.5px}
.rang .gap{width:62px;text-align:right;flex:none}
.faibles{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* score */
.gros{font-size:34px;font-weight:780;letter-spacing:-.02em;line-height:1.1}
.gros small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.barre{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.barre i{display:block;height:100%;background:var(--accent);border-radius:5px}
.profil{display:grid;grid-template-columns:86px 1fr 92px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.profil:first-of-type{border-top:0} .profil .barre{margin:0}
.trio{display:flex;gap:8px} .trio div{flex:1;background:var(--surface2);border-radius:10px;padding:8px 10px;text-align:center}
.trio b{display:block;font-size:20px}
/* agenda */
.jour>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700}
.jour>summary::-webkit-details-marker{display:none}
.rdv{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rdv:first-of-type{margin-top:8px} .rdv .h{font-weight:650;font-size:13px} .rdv .suite{color:var(--muted);font-size:13px;margin-top:2px}
/* verrou */
body.ferme nav{display:none}
.verrou{max-width:420px;margin:28px auto 0;text-align:left}
.verrou h2{font-size:20px;text-transform:none;letter-spacing:0;color:var(--text);margin:0 0 6px}
.verrou p{color:var(--muted);margin:0 0 14px}
.verrou label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.verrou input,.verrou textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.verrou textarea{font:12px/1.4 ui-monospace,Menlo,monospace;height:120px;resize:vertical}
.bouton{display:block;width:100%;margin-top:16px;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:650;font-size:16px;cursor:pointer}
@media (prefers-color-scheme: dark){.bouton{color:#05211e}}
.bouton.second{background:var(--surface2);color:var(--text)}
.bouton:disabled{opacity:.55;cursor:default}
.erreur{color:var(--down);font-size:14px;margin-top:10px;min-height:1.2em}
.lien{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;margin:22px auto 0;display:block;cursor:pointer}
@media (prefers-reduced-motion: reduce){#relire.tourne svg{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Bourse</h1>
  <div id="fraicheur" role="status">Chargement…</div>
  <button id="relire" aria-label="Relire les données">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></svg>
  </button>
</header>
<main id="vue"></main>
<nav aria-label="Onglets"><div id="onglets"></div></nav>
<script>
"use strict";
const ONGLETS = [
  ["alertes", "Alertes", '<path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 7H4c0-1 2-2 2-7z"/><path d="M10 20a2 2 0 0 0 4 0"/>'],
  ["points", "Points", '<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/>'],
  ["predictions", "Prédictions", '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>'],
  ["score", "Score", '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
  ["agenda", "Agenda", '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'],
];
const FICHIERS = ["alertes", "points", "predictions", "score", "agenda", "argent", "etat"];
const BALISES = { ALERTE: "b-down", MOUVEMENT: "b-down", RUMEUR: "b-warn", ARGENT: "b-info", MACRO: "b-info", INFO: "" };
const S = { onglet: "alertes", d: {}, filtre: "TOUTES", jour: null, lu: null, souci: false, vuAvant: null };

/* ---------- petits outils ---------- */
function h(nom, attrs, ...enfants) {
  const e = document.createElement(nom);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "open") e.open = true; else e.setAttribute(k, v);
  }
  for (const c of enfants.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const garde = { lis(k) { try { return localStorage.getItem(k); } catch { return null; } },
                ecris(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const fmtH = new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit" });
const fmtJ = new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", weekday: "short", day: "2-digit", month: "2-digit" });
const fmtCle = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit" });
const heure = iso => fmtH.format(new Date(iso)).replace(":", "h");
const jour = iso => fmtJ.format(new Date(iso)).replace(".", "");
const cleJour = d => fmtCle.format(d);                       // AAAA-MM-JJ, heure de Paris
const jourDeDate = j => jour(j + "T12:00:00Z");              // « mar 24/11 » depuis AAAA-MM-JJ
const nb = (x, d = 2) => x == null ? "—" : Number(x).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (x, d = 1) => x == null ? "—" : (x > 0 ? "+" : x < 0 ? "−" : "") + nb(Math.abs(x), d) + " %";
function quand(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return "à l'instant"; if (min < 60) return "il y a " + min + " min";
  if (cleJour(new Date(iso)) === cleJour(new Date())) return heure(iso);
  return jour(iso) + " " + heure(iso);
}
const sensMot = (s, off) => off ? (s === "H" ? "HAUSSIER" : "BAISSIER") : (s === "H" ? "avis hausse" : "avis baisse");
const verdictBalise = st => st === "juste" ? h("span", { class: "balise b-up" }, "JUSTE")
  : st === "faux" ? h("span", { class: "balise b-down" }, "FAUX") : h("span", { class: "balise" }, "PLAT");

/* Met en couleur les mots clés et les pourcentages signés d'un texte, sans jamais injecter de HTML. */
const MOTIF = /(PAS ENCORE PUBLIÉ|DÉJÀ PUBLIÉ|HAUSSIER|BAISSIER|JUSTE|FAUX|(?<![\dA-Za-zÀ-ÿ])[+−-]\d+(?:,\d+)?\s?%)/g;
function colore(texte) {
  return texte.split(MOTIF).map((bout, i) => {
    if (i % 2 === 0) return bout;
    if (/%$/.test(bout)) return h("span", { class: bout[0] === "+" ? "up" : "down" }, bout);
    const cl = { HAUSSIER: "up", JUSTE: "up", BAISSIER: "down", FAUX: "down", "PAS ENCORE PUBLIÉ": "fort", "DÉJÀ PUBLIÉ": "fort" }[bout];
    return h("span", { class: cl }, bout);
  });
}

/* ---------- coffre : déchiffrement dans le navigateur ---------- */
/* data/cle.json : clé publique + clé privée chiffrée par le mot de passe (PBKDF2-SHA256, AES-256-GCM).
   Chaque fichier de données : clé AES enveloppée par RSA-OAEP-256, contenu en AES-256-GCM.
   La clé privée déverrouillée est gardée dans ce navigateur comme clé NON exportable. */
const COFFRE = { info: null, cle: null, absent: false };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => { const u = new Uint8Array(b); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
function base() { return new Promise((ok, ko) => { const r = indexedDB.open("bourse", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("cles"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
async function baseLis(k) { try { const db = await base(); return await new Promise(ok => {
  const q = db.transaction("cles").objectStore("cles").get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch { return null; } }
async function baseEcris(k, v) { try { const db = await base(); await new Promise(ok => {
  const tr = db.transaction("cles", "readwrite"); v === null ? tr.objectStore("cles").delete(k) : tr.objectStore("cles").put(v, k);
  tr.oncomplete = ok; tr.onerror = ok; }); } catch {} }
async function cleDuMotDePasse(mdp, sel, iter, usages) {
  const brut = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: sel, iterations: iter, hash: "SHA-256" }, brut, { name: "AES-GCM", length: 256 }, false, usages);
}
async function deverrouille(mdp) {
  const i = COFFRE.info, k = await cleDuMotDePasse(mdp, b64d(i.kdf.sel), i.kdf.iter, ["decrypt"]);
  const pkcs8 = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(i.iv) }, k, b64d(i.privee));   // échoue si mauvais mot de passe
  COFFRE.cle = await crypto.subtle.importKey("pkcs8", pkcs8, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]);
  await baseEcris("privee-" + i.empreinte, COFFRE.cle);
}
async function ouvre(env) {
  if (!env || env.chiffre !== 1) return env;
  if (!COFFRE.cle) throw new Error("verrouillé");
  const brute = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, COFFRE.cle, b64d(env.k));
  const aes = await crypto.subtle.importKey("raw", brute, "AES-GCM", false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(env.iv) }, aes, b64d(env.c))));
}
async function empreinte(texte) {
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texte)));
  return [...h.slice(0, 6)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function creeCoffre(mdp) {
  const paire = await crypto.subtle.generateKey({ name: "RSA-OAEP", modulusLength: 3072, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, true, ["encrypt", "decrypt"]);
  const jwk = await crypto.subtle.exportKey("jwk", paire.publicKey);
  const pkcs8 = await crypto.subtle.exportKey("pkcs8", paire.privateKey);
  const sel = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000;
  const k = await cleDuMotDePasse(mdp, sel, iter, ["encrypt"]);
  const info = { v: 1, empreinte: await empreinte(jwk.n), publique: { kty: "RSA", n: jwk.n, e: jwk.e, alg: "RSA-OAEP-256" },
    kdf: { alg: "PBKDF2-SHA256", iter, sel: b64e(sel) }, iv: b64e(iv),
    privee: b64e(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, pkcs8)) };
  COFFRE.info = info;
  COFFRE.cle = await crypto.subtle.importKey("pkcs8", pkcs8, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]);
  await baseEcris("privee-" + info.empreinte, COFFRE.cle);
  return JSON.stringify(info);
}

/* ---------- chargement ---------- */
const lisJSON = n => fetch("data/" + n + ".json?t=" + Date.now(), { cache: "no-store" })
  .then(r => { if (r.status === 404) return null; if (!r.ok) throw new Error(r.status); return r.json(); });
async function recharge() {
  const bouton = document.getElementById("relire"); bouton.classList.add("tourne");
  try {
    const info = await lisJSON("cle");
    COFFRE.absent = !info;
    if (info && (!COFFRE.info || COFFRE.info.empreinte !== info.empreinte)) {
      COFFRE.info = info; COFFRE.cle = await baseLis("privee-" + info.empreinte);
    }
  } catch { /* hors ligne : on garde ce qu'on a */ }
  if (COFFRE.cle || COFFRE.absent) {
    const res = await Promise.allSettled(FICHIERS.map(n => lisJSON(n).then(ouvre)));
    S.souci = false;
    res.forEach((r, i) => { if (r.status === "fulfilled") S.d[FICHIERS[i]] = r.value; else S.souci = true; });
  }
  S.lu = new Date();
  bouton.classList.remove("tourne");
  dessine();
}
function fraicheur() {
  const el = document.getElementById("fraicheur"), maj = S.d.etat && S.d.etat.maj;
  el.classList.toggle("souci", S.souci);
  if (!COFFRE.cle && COFFRE.info) { el.textContent = "Verrouillée"; return; }
  if (S.souci && !maj) { el.textContent = "Données illisibles, nouvelle tentative…"; return; }
  el.textContent = (S.souci ? "Hors ligne · " : "") + (maj ? "Données du " + jour(maj) + " à " + heure(maj) : "Aucune donnée");
}

/* ---------- onglets ---------- */
function nonLues() {
  const vu = garde.lis("alerte_vue") || "";
  return (S.d.alertes || []).filter(a => (a.ts || "") > vu).length;
}
function barre() {
  const n = nonLues();
  document.getElementById("onglets").replaceChildren(...ONGLETS.map(([id, nom, trace]) => {
